<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      
    }
    .box{
      width:300px;
      height:120px;
      border:4px solid #222;
      position:relative;
      overflow:hidden;
    }

    .fill{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:red;

      transform:scaleX(0);
      transform-origin:left;
      transition:transform 5s ;
    }

    .box:hover .fill{
      transform:scaleX(1);
    }
    </style>
</head>

<body>
    <div class="box">
    <div class="fill"></div>
</body>
</html>

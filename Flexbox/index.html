<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
/* NAVBAR */

      .navbar {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .navbar-dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 22px;
        height: 22px;
        border: 2px solid black;
        border-radius: 50%;
        background-color: orangered;
      }

      .search {
        width: 93%;
        height: 22px;
        border: 2px solid #aaa;
      }


        
.box{
   border: 2px solid black; 
   margin:40px 40px;
}



.top,.right,.top2{
display:flex;
flex-direction: row;
}



.one1, .two2, .three3,.second-row,.one11,.two22{
    width:50%;
    border: 2px solid black;
    height:100px;

}
.one,.two{
    width:50%;
    border: 2px solid black;
    height: 397px;
}

.second-row{
    display:flex;
    flex-direction: row;
}
.one11,.two22,.second-row{
    border-bottom: none;
}
.three3{
    border-top: none;
    height:400px;
}

.two22{
    display:flex;
    flex-direction:row;
}

.one1,.two22{
    background-color: violet;
}
.two2, .one{
    background-color: teal;
}
.one11,.three3,.two{
    background-color: green;
}


    </style>
  </head>
  <body>
<div class="box">

      <!-- NAVBAR -->

      <div class="navbar">
        <div class="navbar-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="search"></div>
      </div>

<div class="top">
      <div class="one1"></div>
      <div class="two2"></div>
      </div>
      <div class="top2">
      <div class="one11"></div>
      <div class="two22">

            


      </div>
      </div>


      <div class="right">
        <div class="three3"></div>
        <div class="second-row">
            <div class="one"></div>
            <div class="two"></div>
            </div>
            <div class="third-row"></div>
          </div>


          


  </body>
</html>
